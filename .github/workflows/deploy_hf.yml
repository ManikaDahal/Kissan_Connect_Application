name: Deploy Backend to Hugging Face

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy kissan_backend to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Copy backend into a temp folder and push directly
          cp -r kissan_backend /tmp/hf_deploy
          cd /tmp/hf_deploy

          git init
          git add .
          git commit -m "Deploy: ${{ github.sha }}"
          git push https://manika051:$HF_TOKEN@huggingface.co/spaces/manika051/KissanConnect HEAD:main --force
