name: Deploy Backend to Hugging Face

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Deploy kissan_backend to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Copy backend CONTENTS (not the folder itself) into a temp folder
          mkdir -p /tmp/hf_deploy
          cp -r kissan_backend/. /tmp/hf_deploy/
          cd /tmp/hf_deploy

          # Remove files that should NOT be deployed to Hugging Face:
          # - The eSewa Flutter SDK (27MB of mobile binaries — not needed by Django)
          # - Compiled static files (regenerated by collectstatic in Dockerfile CMD)
          rm -rf "eSewa Flutter Sdk"
          rm -rf staticfiles

          # Fix line endings on the entrypoint script (CRLF -> LF)
          sed -i 's/\r$//' docker-entrypoint.sh

          # Create a .gitignore for the HF repo to exclude junk
          cat > .gitignore << 'EOF'
          __pycache__/
          *.py[cod]
          *.pyo
          .env
          *.log
          db.sqlite3
          media/
          staticfiles/
          EOF

          git init
          git add .
          git commit -m "Deploy: ${{ github.sha }}"
          git push https://manika051:$HF_TOKEN@huggingface.co/spaces/manika051/KissanConnect HEAD:main --force

